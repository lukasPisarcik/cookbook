<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kuchárka">
	<!-- mark spans y 2.7–54; nudged down so it sits centred in the 64×64 box -->
	<g transform="translate(0 3.6)">
		<!-- stub handles, behind the pot body -->
		<rect fill="#b23a6f" x="5.5" y="37" width="8.5" height="6" rx="3" />
		<rect fill="#b23a6f" x="50" y="37" width="8.5" height="6" rx="3" />
		<!-- pot body -->
		<path fill="#b23a6f" d="M13 34h38v12a8 8 0 0 1-8 8H21a8 8 0 0 1-8-8V34Z" />
		<!-- steam curl rising from under the lid -->
		<path
			fill="none"
			stroke="#e0528d"
			stroke-width="2.8"
			stroke-linecap="round"
			d="M32 26C28.8 23.2 35.2 21 32 17.6"
		/>
		<!-- lid -->
		<rect fill="#e0528d" x="9" y="26" width="46" height="6.4" rx="3.2" />
		<!-- the steam resolves into a heart -->
		<path
			fill="#e0528d"
			d="M32 17.5c-1.1-1-8.5-5.6-8.5-10.1 0-2.6 2.1-4.7 4.7-4.7 1.65 0 3.05.8 3.8 2 .75-1.2 2.15-2 3.8-2 2.6 0 4.7 2.1 4.7 4.7 0 4.5-7.4 9.1-8.5 10.1Z"
		/>
	</g>
</svg>
